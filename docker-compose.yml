# Local Postgres for agent persistence (mirrors Neon / Vercel Postgres in prod)
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: agent_sandbox
    volumes:
      - sandbox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d agent_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sandbox_pg:
