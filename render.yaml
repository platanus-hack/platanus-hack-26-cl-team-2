# Render Blueprint: one web service that runs the API and serves the built web app.
# SQLite lives on the instance disk: it is wiped on every deploy and re-seeded at start
# with the same senior agents (db:seed is idempotent). Saved runs are wiped with it.
services:
  - type: web
    name: mesh-lab
    runtime: node
    plan: starter
    buildCommand: npx -y pnpm@9.15.0 install --frozen-lockfile && npx -y pnpm@9.15.0 --filter @sandbox/web build
    startCommand: npx -y pnpm@9.15.0 --filter @sandbox/api db:seed && npx -y pnpm@9.15.0 --filter @sandbox/api exec tsx src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_JUDGE_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_REFINE_MODEL
        value: claude-haiku-4-5-20251001
      - key: MAX_TURNS_PER_AGENT
        value: "12"
      # Public demo protections (README "Public demo protections"). ADMIN_TOKEN: set a long
      # random value in the dashboard; writes (agents, fleets, saved profiles) then need it.
      - key: ADMIN_TOKEN
        sync: false
      # Writes (agents, companies, saved profiles) open to everyone, no token needed.
      # Delete this to require ADMIN_TOKEN again.
      - key: ALLOW_PUBLIC_WRITES
        value: "1"
      # Demo limits all off ("0" disables each; removing a key falls back to the code default).
      - key: RATE_LIMIT_PER_MINUTE
        value: "0"
      - key: MAX_RUNS_PER_DAY
        value: "0"
      - key: MAX_CONCURRENT_RUNS
        value: "0"
      - key: MAX_JUDGE_CALLS_PER_DAY
        value: "0"
      - key: MAX_STORED_AGENTS
        value: "0"
      # Hard US$ ceiling per day, measured from response usage. Resets on each restart/deploy.
      - key: MAX_SPEND_USD_PER_DAY
        value: "0"
